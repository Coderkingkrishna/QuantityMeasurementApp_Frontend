<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantity Measurement</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="bg-shape bg-shape-left"></div>
  <div class="bg-shape bg-shape-right"></div>

  <main class="container">
    <header class="app-header">
      <h1>Welcome To Quantity Measurement</h1>
      <div class="auth-actions">
        <span id="welcomeUser" class="welcome-user"></span>
        <a class="link-btn" href="login.html" id="loginLink">Login</a>
        <a class="link-btn" href="signup.html" id="signupLink">Sign Up</a>
        <button class="link-btn" id="logoutBtn" type="button">Logout</button>
      </div>
    </header>

    <section class="panel">
      <p class="label">Choose Type</p>
      <div id="categoryCards" class="cards"></div>

      <p class="label">Choose Action</p>
      <div class="tabs">
        <button class="tab is-active" type="button" data-action="comparison">Comparison</button>
        <button class="tab" type="button" data-action="conversion">Conversion</button>
        <button class="tab" type="button" data-action="arithmetic">Arithmetic</button>
      </div>

      <div id="comparisonFields" class="field-grid">
        <div>
          <p class="sub-label">Value 1</p>
          <div class="input-card">
            <input type="number" id="compareValue1" value="1" step="any">
            <select id="compareUnit1"></select>
          </div>
        </div>
        <div>
          <p class="sub-label">Value 2</p>
          <div class="input-card">
            <input type="number" id="compareValue2" value="1000" step="any">
            <select id="compareUnit2"></select>
          </div>
        </div>
      </div>

      <div id="conversionFields" class="field-grid is-hidden">
        <div>
          <p class="sub-label">From</p>
          <div class="input-card">
            <input type="number" id="convertValue" value="1" step="any">
            <select id="convertUnitFrom"></select>
          </div>
        </div>
        <div>
          <p class="sub-label">To</p>
          <div class="input-card">
            <select id="convertUnitTo"></select>
          </div>
        </div>
      </div>

      <div id="arithmeticFields" class="field-grid is-hidden">
        <div>
          <p class="sub-label">Value 1</p>
          <div class="input-card">
            <input type="number" id="arithValue1" value="1" step="any">
            <select id="arithUnit1"></select>
          </div>
        </div>
        <div class="operator-wrap">
          <p class="sub-label">Operator</p>
          <select id="arithOperator" class="operator-select"></select>
        </div>
        <div>
          <p class="sub-label">Value 2</p>
          <div class="input-card">
            <input type="number" id="arithValue2" value="1" step="any">
            <select id="arithUnit2"></select>
          </div>
        </div>
        <div id="arithTargetWrap">
          <p class="sub-label">Result Unit</p>
          <div class="input-card">
            <select id="arithTargetUnit"></select>
          </div>
        </div>
      </div>

      <div class="actions-row">
        <button id="calculateBtn" class="cta" type="button">Calculate</button>
        <button id="historyToggleBtn" class="secondary-btn" type="button">View History</button>
      </div>

      <div class="result-card">
        <p class="sub-label">Result</p>
        <div id="resultText" class="result-text">-</div>
        <div id="resultSubText" class="result-sub-text"></div>
      </div>

      <section id="historyPanel" class="history-panel is-hidden">
        <p class="sub-label">Operation History</p>
        <p id="historyMessage" class="history-message"></p>
        <ul id="historyList" class="history-list"></ul>
      </section>

      <p id="message" class="message"></p>
    </section>
  </main>

  <script src="scripts/api.js"></script>
  <script src="scripts/auth.js"></script>
  <script src="scripts/app.js"></script>
</body>
</html>
