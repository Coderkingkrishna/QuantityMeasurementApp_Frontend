<main class="auth-page">
  <section class="auth-card">
    <h1>Login</h1>
    <p class="auth-sub">Sign in to access history and secure actions.</p>

    <label for="email">Email</label>
    <input
      id="email"
      type="email"
      placeholder="you@example.com"
      autocomplete="email"
      [(ngModel)]="email"
      name="email"
    />

    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      placeholder="Enter password"
      autocomplete="current-password"
      [(ngModel)]="password"
      name="password"
    />

    <button class="cta" type="button" (click)="login()">Login</button>

    <div class="auth-divider"><span>or</span></div>
    <div id="googleLoginButton"></div>

    <p class="message">{{ authMessage }}</p>

    <div class="auth-links">
      <a routerLink="/signup">Create an account</a>
      <a routerLink="/">Back to app</a>
    </div>
  </section>
</main>
